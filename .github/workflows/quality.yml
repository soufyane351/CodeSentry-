
name: CodeSentry Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Validate CodeSentry
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rojo
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/rojo-rbx/rojo/releases/download/v7.4.4/rojo-7.4.4-linux-x86_64.zip -o rojo.zip
          unzip -o rojo.zip -d "$HOME/.local/bin"
          chmod +x "$HOME/.local/bin/rojo"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rojo --version

      - name: Validate project configuration
        run: python3 -m json.tool default.project.json > /dev/null

      - name: Build Roblox project
        run: rojo build default.project.json --output CodeSentry.rbxlx

      - name: Verify build output
        run: test -s CodeSentry.rbxlx
